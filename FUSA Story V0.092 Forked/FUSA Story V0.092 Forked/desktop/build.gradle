plugins {
  id 'application'
}

dependencies {
  api project(':core')
}

sourceSets.main.java.srcDirs = [ 'src/main/java' ]

application {
  mainClass = 'com.yourgame.survival.desktop.DesktopLauncher'
}

tasks.named('run') {
  // Run from assets/ so Gdx.files.internal("data/...") resolves correctly.
  workingDir = new File(rootProject.projectDir, 'assets')
}

// run with: gradlew :desktop:run

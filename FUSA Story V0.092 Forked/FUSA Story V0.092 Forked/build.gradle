allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  version = '1.0'
  ext {
    appName = 'FuckUSurvival'
    gdxVersion = '1.12.1'
    roboVMVersion = '2.3.20'
    box2DLightsVersion = '1.5'
    ashleyVersion = '1.7.4'
    aiVersion = '1.8.2'
  }

  repositories {
    mavenCentral()
  }
}

// TexturePacker (Block 1.4)
configurations {
  texturePacker
}

dependencies {
  texturePacker "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
}

tasks.register('packAtlasStatic', JavaExec) {
  group = 'assets'
  description = 'Packs assets/atlas/src_static into assets/atlas/static.atlas + static.png'
  classpath = configurations.texturePacker
  mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'

  def inputDir = file('assets/atlas/src_static')
  def outputDir = file('assets/atlas')
  args inputDir.absolutePath, outputDir.absolutePath, 'static', file('assets/atlas/packer-settings.json').absolutePath
}

tasks.register('packAtlasLiving', JavaExec) {
  group = 'assets'
  description = 'Packs assets/atlas/src_living into assets/atlas/living.atlas + living.png'
  classpath = configurations.texturePacker
  mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'

  def inputDir = file('assets/atlas/src_living')
  def outputDir = file('assets/atlas')
  args inputDir.absolutePath, outputDir.absolutePath, 'living', file('assets/atlas/packer-settings.json').absolutePath
}

tasks.register('packAtlasUi', JavaExec) {
  group = 'assets'
  description = 'Packs assets/atlas/src_ui into assets/atlas/ui.atlas + ui.png'
  classpath = configurations.texturePacker
  mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'

  def inputDir = file('assets/atlas/src_ui')
  def outputDir = file('assets/atlas')
  args inputDir.absolutePath, outputDir.absolutePath, 'ui', file('assets/atlas/packer-settings.json').absolutePath
}

// Default pack: all atlases (new layout).
// NOTE: Runtime has a safe fallback to legacy assets/atlas/game.atlas.
tasks.register('packAtlas') {
  group = 'assets'
  description = 'Packs all atlases (static + living + ui)'
  dependsOn 'packAtlasStatic', 'packAtlasLiving', 'packAtlasUi'
}

subprojects {
  apply plugin: 'java-library'

  java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }
}
